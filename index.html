<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touhou Music Room (fan remake)</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("tmrTheme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
<script src="https://w.soundcloud.com/player/api.js"></script>
<style>
:root{--bg:#f4ecea;--fg:#222;--card:#fff;--ac:#c0392b;--mut:#777}
:root[data-theme="dark"]{--bg:#16121a;--fg:#eee;--card:#241d2b;--mut:#999}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:12px;display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:700px){main{grid-template-columns:1fr}}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border-radius:10px;padding:8px 12px}
h1{font-size:20px;margin:0}.bar{display:flex;gap:6px}
.c{background:var(--card);border-radius:10px;padding:12px}h2{font-size:15px;margin:0 0 8px}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 12px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--mut)}#dc{background:#5865F2}
input{padding:8px;border-radius:6px;border:1px solid var(--mut);background:var(--bg);color:var(--fg);font-size:15px;min-width:0}
.row{display:flex;gap:6px;margin-top:6px}.row input{flex:1}.m{color:var(--mut);font-size:13px}
#chat{height:340px;overflow:auto;font-size:14px}ul{list-style:none;padding:0;margin:0}li{display:flex;justify-content:space-between;padding:3px 0}
#big{font-size:24px;text-align:center;margin:6px 0}#sc{position:fixed;right:0;bottom:0;width:300px;height:166px;border:0;opacity:0;pointer-events:none}
label{display:block;margin-top:8px;font-size:14px}#gl label{display:flex;gap:6px;margin:3px 0;align-items:center}#gl{max-height:240px;overflow:auto}
.pg{margin-bottom:8px}.pg>label{font-weight:600}.pg .g{margin-left:18px}.off{opacity:.45}
input[type=number]{width:80px;flex:none!important;margin-left:6px}
.col{display:flex;flex-direction:column;min-height:230px}.vrow{align-items:center}.vrow input{padding:0;border:0;accent-color:var(--ac);background:none}
.sg{position:relative;flex:1;display:flex}
#sug{position:absolute;left:0;right:0;bottom:100%;max-height:200px;overflow:auto;background:var(--card);border:1px solid var(--mut);border-radius:6px;z-index:5;display:none}
#sug div{padding:6px 8px;cursor:pointer;font-size:14px}#sug .a,#sug div:hover{background:var(--ac);color:#fff}#sug .a .m,#sug div:hover .m{color:#fff}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#g.bad{animation:sh .35s;border-color:#e74c3c;background:rgba(231,76,60,.2)}#g.good{border-color:#2ecc71;background:rgba(46,204,113,.2)}
#fb{min-height:18px;margin-top:6px}#fb.bad{color:#e74c3c}#fb.good{color:#2ecc71}
</style></head><body><main>
<header><h1>Touhou Music Room <span class="m" data-i="sub"></span></h1>
<div class="bar"><button id="thm" class="ghost" data-ti="theme"></button><button id="lng" class="ghost"></button><a id="dc" class="btn" target="_blank" rel="noopener" data-ti="dctitle">Discord</a></div></header>
<div class="c"><h2 data-i="room"></h2>
<div class="row"><input id="nick" maxlength="16" data-ph="nick"><input id="room" maxlength="24" minlength="3" value="" data-ph="code"></div>
<div class="row"><button id="jb" data-i="join"></button></div>
<p class="m" id="st"></p>
<h2 data-i="players"></h2><ul id="pl"></ul></div>
<div class="c col"><h2 data-i="round"></h2><div id="big">—</div><div class="m" id="info"></div><div class="m" id="aud"></div>
<div class="row"><button id="start" disabled data-i="start"></button><button id="skip" disabled data-i="skip"></button><button id="stop" disabled data-i="stop"></button><button id="play" disabled data-i="play"></button></div>
<div class="row vrow"><span data-ti="vol">🔊</span><input id="vol" type="range" min="0" max="100" value="70"></div>
<div id="fb" class="m"></div>
<div class="row" style="margin-top:auto"><div class="sg"><input id="g" autocomplete="off" disabled data-ph="guessph"><div id="sug"></div></div><button id="gb" disabled data-i="guess"></button></div></div>
<div class="c"><h2><span data-i="settings"></span> <span class="m" data-i="sethint"></span></h2><div class="m" data-i="allowed"></div><div id="gl"></div>
<label><span data-i="rounds"></span><input id="rn" type="number" min="1" max="100" disabled></label>
<label><span data-i="sec"></span><input id="sec" type="number" min="10" max="180" disabled></label>
<label><span data-i="cd"></span><input id="cd" type="number" min="3" max="60" disabled></label></div>
<div class="c"><h2 data-i="chat"></h2><div id="chat"></div><div class="row"><input id="ci" disabled data-ph="msg"><button id="cb" disabled data-i="send"></button></div></div>
<iframe id="sc" allow="autoplay"></iframe></main>
<script>
const WORKER="wss://touhou-music-room.touhoumusicroom.workers.dev";   // Worker Link
const DISCORD_URL="https://discord.gg/REPLACE";                         // Discord Link
const I18N={
pl:{sub:"– fan remake",room:"Pokój",nick:"Nick",code:"Nazwa pokoju",join:"Dołącz / utwórz",intro:"Pierwsza osoba w pokoju jest hostem (może startować rundy). Gdy host wyjdzie, rolę przejmuje następna osoba.",players:"Gracze",round:"Runda",start:"Start gry",skip:"Pomiń",stop:"Stop",play:"▶ Otwórz",guessph:"Jaki to utwór?",guess:"Zgaduj",vol:"Głośność",settings:"Ustawienia gry",sethint:"(zmienia host, w lobby)",allowed:"Dozwolone gry:",rounds:"Liczba rund",sec:"Czas na zgadywanie (s)",cd:"Przerwa między rundami (s)",chat:"Czat",msg:"Wiadomość",send:"Wyślij",theme:"Zmień motyw",dctitle:"Dołącz do naszego Discorda",other:"Inne",
needw:"⚠ Ustaw adres Workera (WORKER) w index.html.",conn:"Łączenie…",badurl:"Nieprawidłowy adres Workera.",to:"Brak odpowiedzi serwera w 10 s – spróbuj ponownie.",short:"Nazwa pokoju musi mieć min. 3 znaki (litery lub cyfry).",closed:"Rozłączono (pokój pełny, zły adres Workera lub brak dostępu). Spróbuj ponownie.",joined:"Jesteś w pokoju „{0}”.",
rinfo:"Runda {0}/{1} – zgadnij tytuł!",ans:"Odpowiedź: {0} ({1})",next:"Następna za ",fin:"Koniec gry – host może wystartować kolejną.",
aload:"Ładowanie utworu…",aplay:"♪ Gra",astuck:"Nie wystartowało – kliknij ▶ Play (przeglądarka mogła zablokować autoodtwarzanie).",aerr:"⚠ SoundCloud zwrócił błąd (link prywatny lub osadzanie wyłączone?)",aph:"⚠ W worker/src/tracks.js został placeholder – podmień link SoundCloud.",
guessed:"{0} zgadł(a)!",final:"Koniec gry! ",notr:"Brak utworów dla wybranych gier.",lim:"Dostępnych utworów: {0} – tyle rund zagramy.",wrong:"✗ Źle",right:"✓ Dobrze!"},
en:{sub:"– fan remake",room:"Room",nick:"Nickname",code:"Room name",join:"Join / create",intro:"The first person in the room is the host (can start rounds). If the host leaves, the next person takes over.",players:"Players",round:"Round",start:"Start game",skip:"Skip",stop:"Stop",play:"▶ Play",guessph:"What is the song?",guess:"Guess",vol:"Volume",settings:"Game settings",sethint:"(host only, in lobby)",allowed:"Allowed games:",rounds:"Rounds",sec:"Guess time (s)",cd:"Cooldown between rounds (s)",chat:"Chat",msg:"Message",send:"Send",theme:"Toggle theme",dctitle:"Join our Discord",other:"Other",
needw:"⚠ Set the Worker address (WORKER) in index.html.",conn:"Connecting…",badurl:"Invalid Worker address.",to:"No server response within 10 s – try again.",short:"Room name must be at least 3 characters (letters or digits).",closed:"Disconnected (room full, wrong Worker URL, or access denied). Try again.",joined:"You're in room \"{0}\".",
rinfo:"Round {0}/{1} – guess the title!",ans:"Answer: {0} ({1})",next:"Next in ",fin:"Game over – the host can start another one.",
aload:"Loading track…",aplay:"♪ Playing",astuck:"Didn't start – click ▶ Play (the browser may have blocked autoplay).",aerr:"⚠ SoundCloud returned an error (private link or embedding disabled?)",aph:"⚠ A placeholder is left in worker/src/tracks.js – replace the SoundCloud link.",
guessed:"{0} got it!",final:"Game over! ",notr:"No tracks for the selected games.",lim:"Only {0} tracks available – we'll play that many rounds.",wrong:"✗ Wrong",right:"✓ Correct!"}};
const $=id=>document.getElementById(id),norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lang=(navigator.language||"").toLowerCase().startsWith("pl")?"pl":"en";try{const sl=localStorage.getItem("tmrLang");if(sl)lang=sl}catch(e){}
const t=(k,...a)=>(I18N[lang][k]||k).replace(/\{(\d)\}/g,(_,i)=>a[i]);
const dyn={};function setT(id,k,...a){dyn[id]=k?[k,a]:null;$(id).textContent=k?t(k,...a):""}
let ws,myId,hostId,tracks=[],groups=[],cfg=null,phase="lobby",widget,tick,pt,ready=false,picked=null,roundOn=false,playing=false;
function applyLang(){document.documentElement.lang=lang;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
 document.querySelectorAll("[data-ti]").forEach(e=>e.title=t(e.dataset.ti));
 $("lng").textContent=lang==="pl"?"EN":"PL";
 for(const id in dyn)if(dyn[id])$(id).textContent=t(dyn[id][0],...dyn[id][1]);
 buildGroups();updUI()}
$("lng").onclick=()=>{lang=lang==="pl"?"en":"pl";try{localStorage.setItem("tmrLang",lang)}catch(e){}applyLang()};
function setTheme(x){document.documentElement.dataset.theme=x;$("thm").textContent=x==="dark"?"☀️":"🌙";try{localStorage.setItem("tmrTheme",x)}catch(e){}}
$("thm").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("dc").href=DISCORD_URL;
const log=(n,x)=>{const d=document.createElement("div");d.innerHTML="<b>"+esc(n)+":</b> "+esc(x);$("chat").append(d);$("chat").scrollTop=1e9};
const send=m=>ws&&ws.readyState===1&&ws.send(JSON.stringify(m));
const isHost=()=>hostId===myId;
function countdown(sec,key){const e=Date.now()+sec*1000;clearInterval(tick);const f=()=>{const s=Math.max(0,Math.ceil((e-Date.now())/1000));$("big").textContent=(key?t(key):"")+s+" s";if(!s)clearInterval(tick)};f();tick=setInterval(f,250)}
function buildGroups(){$("gl").innerHTML=groups.map(g=>'<div class="pg"><label><input type="checkbox" data-p> '+esc(g.platform==="Inne"?t("other"):g.platform)+'</label>'+g.games.map(x=>'<label class="g'+(x.c?'':' off')+'"><input type="checkbox" data-g value="'+esc(x.n)+'"'+(x.c?'':' disabled data-off')+'> '+esc(x.n)+' <span class="m">('+x.c+')</span></label>').join("")+'</div>').join("")}
function updPlay(){$("play").disabled=!(ready&&roundOn&&!playing)}
function updUI(){const h=isHost(),lob=phase==="lobby";
 $("start").disabled=!(h&&lob);$("skip").disabled=$("stop").disabled=!(h&&!lob);
 document.querySelectorAll("#gl .pg").forEach(pg=>{const gs=[...pg.querySelectorAll("input[data-g]")];
  gs.forEach(c=>{c.disabled=c.hasAttribute("data-off")||!(h&&lob);if(cfg)c.checked=cfg.games.includes(c.value)});
  const on=gs.filter(c=>!c.hasAttribute("data-off")),sel=on.filter(c=>c.checked).length,pc=pg.querySelector("input[data-p]");
  pc.disabled=!on.length||!(h&&lob);pc.checked=on.length>0&&sel===on.length;pc.indeterminate=sel>0&&sel<on.length});
 [["rn","rounds"],["sec","sec"],["cd","cd"]].forEach(([i,k])=>{const e=$(i);e.disabled=!(h&&lob);if(cfg&&document.activeElement!==e)e.value=cfg[k]})}
function sendCfg(){send({t:"settings",games:[...document.querySelectorAll("#gl input[data-g]:checked")].map(c=>c.value),rounds:$("rn").value,sec:$("sec").value,cd:$("cd").value})}
function flash(ok){const g=$("g"),f=$("fb");g.classList.remove("bad","good");f.className="m";void g.offsetWidth;g.classList.add(ok?"good":"bad");f.classList.add(ok?"good":"bad");f.textContent=t(ok?"right":"wrong");
 clearTimeout(flash.t);flash.t=setTimeout(()=>{g.classList.remove("bad","good");f.className="m";f.textContent=""},900)}
function sysMsg(m){const a=m.a||[];if(m.k==="final")log("system",t("final")+m.r.map((p,i)=>(i+1)+". "+p.n+" "+p.s).join(" · "));else log("system",t(m.k,...a))}
function onMsg(m){
 if(m.t==="hello")myId=m.id;
 else if(m.t==="meta"){tracks=m.tracks;groups=m.groups;buildGroups();updUI()}
 else if(m.t==="state"){hostId=m.host;phase=m.phase;cfg=m.cfg;$("pl").innerHTML=[...m.p].sort((a,b)=>b.s-a.s).map(p=>"<li><span>"+(p.id===m.host?"👑 ":"")+esc(p.n)+"</span><b>"+p.s+"</b></li>").join("");
  if(!ready){ready=true;["g","gb","ci","cb"].forEach(i=>$(i).disabled=false);setT("st","joined",$("room").value)}
  updUI();updPlay()}
 else if(m.t==="chat")log(m.n,m.x);
 else if(m.t==="sys")sysMsg(m);
 else if(m.t==="wrong")flash(false);
 else if(m.t==="right")flash(true);
 else if(m.t==="round"){roundOn=true;playing=false;updPlay();setT("info","rinfo",m.n,m.total);playUrl(m.url);countdown(m.sec,null)}
 else if(m.t==="reveal"){roundOn=false;playing=false;updPlay();setT("info","ans",m.title,m.game);if(widget)widget.pause();countdown(m.cd,"next")}
 else if(m.t==="final"){roundOn=false;playing=false;updPlay();clearInterval(tick);$("big").textContent="—";setT("info","fin");if(widget)widget.pause()}}
function playUrl(u){clearTimeout(pt);
 if(u.includes("REPLACE")){setT("aud","aph");return}
 setT("aud","aload");
 pt=setTimeout(()=>setT("aud","astuck"),7000);
 if(widget){widget.load(u,{auto_play:true,visual:false});return}
 $("sc").src="https://w.soundcloud.com/player/?url="+encodeURIComponent(u)+"&auto_play=true&visual=false";
 widget=SC.Widget($("sc"));const E=SC.Widget.Events;
 widget.bind(E.READY,()=>{applyVol();widget.play()});
 widget.bind(E.PLAY,()=>{playing=true;updPlay();applyVol();clearTimeout(pt);setT("aud","aplay")});
 widget.bind(E.PAUSE,()=>{playing=false;updPlay()});widget.bind(E.FINISH,()=>{playing=false;updPlay()});
 widget.bind(E.ERROR,()=>{playing=false;updPlay();clearTimeout(pt);setT("aud","aerr")})}
$("jb").onclick=()=>{
 const name=$("nick").value.trim()||"Gracz"+(Math.random()*99|0),code=norm($("room").value);
 if(code.length<3){setT("st","short");return}
 if(WORKER.includes("TWOJA-SUBDOMENA")){setT("st","needw");return}
 $("jb").disabled=true;setT("st","conn");ready=false;
 try{ws=new WebSocket(WORKER+"/room/"+code)}catch(e){$("jb").disabled=false;setT("st","badurl");return}
 const to=setTimeout(()=>{if(!ready){ws.close();$("jb").disabled=false;setT("st","to")}},10000);
 ws.onopen=()=>send({t:"join",name});
 ws.onmessage=e=>{try{onMsg(JSON.parse(e.data))}catch(x){}};
 ws.onclose=()=>{clearTimeout(to);ready=false;roundOn=false;playing=false;["g","gb","ci","cb","start","skip","stop","play"].forEach(i=>$(i).disabled=true);$("jb").disabled=false;setT("st","closed")}};
$("cb").onclick=()=>{const v=$("ci").value.trim();if(v){send({t:"chat",x:v});$("ci").value=""}};
$("gb").onclick=()=>{hideSug();const v=$("g").value;if(!v.trim())return;$("g").value="";send({t:"guess",x:v,gm:picked||undefined});picked=null};
$("ci").onkeydown=e=>{if(e.key==="Enter")$("cb").click()};
$("start").onclick=()=>send({t:"start"});$("skip").onclick=()=>send({t:"skip"});$("stop").onclick=()=>send({t:"stop"});$("play").onclick=()=>widget&&widget.play();
$("gl").onchange=e=>{if(e.target.hasAttribute("data-p"))e.target.closest(".pg").querySelectorAll("input[data-g]:not([data-off])").forEach(c=>c.checked=e.target.checked);sendCfg()};
["rn","sec","cd"].forEach(i=>$(i).onchange=sendCfg);
// ---- podpowiedzi: tylko utwory z włączonych gier; strzałki, Tab, Enter, Esc ----
const sg=$("sug");let sa=[],si=-1;
const shown=()=>sg.style.display==="block"&&sa.length>0;
function hideSug(){sg.style.display="none";si=-1}
function hl(){[...sg.children].forEach((c,i)=>c.className=i===si?"a":"");const c=sg.children[si];if(c)c.scrollIntoView({block:"nearest"})}
function sugg(){const q=norm($("g").value);
 const pool=tracks.filter(x=>!cfg||cfg.games.includes(x.g));
 sa=q.length<2?[]:pool.filter(x=>norm(x.t).includes(q)).sort((a,b)=>(norm(b.t).startsWith(q)-norm(a.t).startsWith(q))).slice(0,10);si=-1;
 sg.innerHTML=sa.map((x,i)=>'<div data-i="'+i+'">'+esc(x.t)+' <span class="m">· '+esc(x.g)+'</span></div>').join("");sg.style.display=sa.length?"block":"none"}
function pick(i){$("g").value=sa[i].t;picked=sa[i].g;hideSug()}
$("g").oninput=()=>{picked=null;sugg()};
sg.onmousedown=e=>{const d=e.target.closest("[data-i]");if(d){e.preventDefault();pick(+d.dataset.i);$("gb").click()}};
$("g").addEventListener("keydown",e=>{
 if(e.key==="Enter"){e.preventDefault();if(shown()&&si>=0)pick(si);$("gb").click()}
 else if(e.key==="Tab"&&shown()){e.preventDefault();pick(si>=0?si:0)}
 else if(e.key==="Escape")hideSug();
 else if(shown()&&(e.key==="ArrowDown"||e.key==="ArrowUp")){e.preventDefault();si=(si+(e.key==="ArrowDown"?1:-1)+sa.length)%sa.length;hl()}});
$("g").onblur=()=>setTimeout(hideSug,150);
// ---- głośność ----
function applyVol(){if(widget)widget.setVolume(+$("vol").value)}
try{const sv=localStorage.getItem("tmrVol");if(sv!==null)$("vol").value=+sv}catch(e){}
$("vol").oninput=()=>{applyVol();try{localStorage.setItem("tmrVol",$("vol").value)}catch(e){}};
setT("st","intro");setTheme(document.documentElement.dataset.theme);applyLang();
</script></body></html>
